<section class="card tab-panel" data-tab="executed">
    <div class="panel">
        <!-- cabeçalho: título e descrição à esquerda, recarregar à direita -->
        <div class="panel-header list-header">
            <div class="list-intro">
                <h3>Ordens executadas</h3>
                <p>Ordens preenchidas das moedas que estão na carteira hoje (moedas já zeradas não aparecem).</p>
                <p id="executed-status" class="list-note" hidden></p>
            </div>
            <button type="button" class="pc-btn" onclick="loadExecutedOrders()" title="Buscar as ordens de novo na Binance">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 4v5h-5"/></svg>
                Recarregar
            </button>
        </div>

        <!-- filtros (par com busca, lado em chips) e resumo do que está filtrado -->
        <div class="filter-bar">
            <div class="filter-field">
                <label for="executedPairSearch">Par</label>
                <div class="pair-combo" id="executedPairCombo">
                    <input type="search" id="executedPairSearch" placeholder="Todos os pares" autocomplete="off" spellcheck="false"
                           role="combobox" aria-expanded="false" aria-controls="executedPairList" />
                    <ul class="pair-combo-list" id="executedPairList" role="listbox" hidden></ul>
                </div>
            </div>
            <div class="filter-field">
                <span class="filter-label">Lado</span>
                <div class="side-chips">
                    <label class="pc-chip side-chip buy"><input type="checkbox" id="executedSideBuy" checked /><span>BUY</span></label>
                    <label class="pc-chip side-chip sell"><input type="checkbox" id="executedSideSell" checked /><span>SELL</span></label>
                </div>
            </div>
            <dl class="filter-summary">
                <div><dt>Ordens</dt><dd id="executed-count">--</dd></div>
                <div><dt>Compras</dt><dd id="executed-buys">--</dd></div>
                <div><dt>Vendas</dt><dd id="executed-sells">--</dd></div>
            </dl>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th onclick="sortExecutedOrders('time')">Data e Hora ⇅</th>
                        <th onclick="sortExecutedOrders('symbol')">Par ⇅</th>
                        <th onclick="sortExecutedOrders('side')">Lado ⇅</th>
                        <th onclick="sortExecutedOrders('avgPrice')">Preço médio ⇅</th>
                        <th onclick="sortExecutedOrders('qty')">QTD ⇅</th>
                        <th onclick="sortExecutedOrders('quoteQty')">Total ⇅</th>
                        <th onclick="sortExecutedOrders('totalUSDT')">Total (USDT) ⇅</th>
                        <th onclick="sortExecutedOrders('feeUSDT')">Taxa (USDT) ⇅</th>
                    </tr>
                </thead>
                <tbody id="table-body-executed">
                    <tr><td colspan="8">Abra esta aba para carregar.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
