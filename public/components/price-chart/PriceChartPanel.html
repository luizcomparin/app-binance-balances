<section class="card tab-panel" data-tab="price-chart" id="price-chart-panel">
  <div class="panel">
  <div class="price-chart-header">
    <!-- topo: moeda (abre a lista) e ajustar zoom -->
    <div class="pc-top">
      <div class="asset-picker-wrap">
        <h2>
          <button type="button" class="asset-picker-btn" id="price-chart-title-btn" aria-haspopup="listbox" aria-expanded="false" title="Trocar moeda">
            <span id="price-chart-title">Preço</span>
            <span class="asset-picker-caret" aria-hidden="true">▾</span>
          </button>
        </h2>
        <div class="asset-picker" id="asset-picker" hidden>
          <input type="search" id="asset-picker-search" placeholder="Buscar moeda..." autocomplete="off" spellcheck="false" />
          <ul id="asset-picker-list" role="listbox"></ul>
        </div>
      </div>
      <button type="button" class="pc-btn" id="price-chart-fit" title="Enquadrar todo o período carregado">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        Ajustar zoom
      </button>
    </div>

    <!-- preço atual, preço médio e diferença -->
    <div id="price-chart-info" class="pc-stats"></div>

    <!-- tipo, tamanho da vela e período -->
    <div class="pc-controls">
      <div class="pc-group">
        <span class="pc-label">Tipo</span>
        <div class="pc-seg" id="price-chart-mode">
          <button type="button" data-mode="line" title="Linha">Linha</button>
          <button type="button" data-mode="candle" title="Velas">Velas</button>
        </div>
      </div>
      <div class="pc-group">
        <span class="pc-label">Intervalo</span>
        <div class="pc-seg" id="price-chart-interval" title="Tamanho da vela">
          <button type="button" data-interval="1h" title="1 hora">1h</button>
          <button type="button" data-interval="4h" title="4 horas">4h</button>
          <button type="button" data-interval="1d" title="Diário">D</button>
          <button type="button" data-interval="1w" title="Semanal">S</button>
          <button type="button" data-interval="1M" title="Mensal">M</button>
        </div>
      </div>
      <div class="pc-group">
        <span class="pc-label">Período</span>
        <div class="pc-row" id="price-chart-ranges">
          <div class="pc-seg">
            <button type="button" data-range="7d">7d</button>
            <button type="button" data-range="30d">30d</button>
            <button type="button" data-range="90d">90d</button>
            <button type="button" data-range="6m">6 meses</button>
            <button type="button" class="active" data-range="1y">1 ano</button>
            <button type="button" data-range="2y">2 anos</button>
            <button type="button" data-range="all">Tudo</button>
          </div>
          <div class="pc-custom" id="price-chart-custom-wrap">
            <button type="button" class="pc-btn" id="price-chart-custom-btn" aria-haspopup="true" aria-expanded="false">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
              <span id="price-chart-custom-label">Personalizado</span>
              <span class="pc-caret" aria-hidden="true">▾</span>
            </button>
            <form class="pc-pop price-chart-custom" id="price-chart-custom" hidden>
              <span class="pc-label">Últimos</span>
              <div class="pc-pop-row">
                <input type="number" id="price-chart-custom-value" min="1" max="9999" step="1" placeholder="Ex: 2" />
                <select id="price-chart-custom-unit">
                  <option value="d">Dias</option>
                  <option value="m" selected>Meses</option>
                  <option value="y">Anos</option>
                </select>
              </div>
              <button type="submit" class="pc-btn pc-btn-accent">Aplicar</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- camadas extras sobre/abaixo do gráfico -->
    <div class="pc-section">
      <span class="pc-label">Camadas</span>
      <div class="pc-chips">
        <label class="price-chart-sim-toggle pc-chip" id="price-chart-projected-label">
          <input type="checkbox" id="price-chart-projected" />
          <span class="mini-spinner sim-spinner"></span>
          <span id="price-chart-projected-text">Preço médio após compras abertas</span>
        </label>
        <label class="price-chart-sim-toggle pc-chip" id="price-chart-liq-label" title="Regiões onde posições alavancadas dos futuros seriam liquidadas, estimadas a partir do open interest e da razão long/short dos últimos 30 dias (não é dado real)">
          <input type="checkbox" id="price-chart-liq" />
          <span>Mapa de liquidação</span>
        </label>
        <label class="price-chart-sim-toggle pc-chip" id="price-chart-fut-label" title="Painéis de open interest, long/short e taxa de funding dos futuros perpétuos, abaixo do gráfico">
          <input type="checkbox" id="price-chart-fut" />
          <span class="mini-spinner sim-spinner"></span>
          <span id="price-chart-fut-text">Dados de futuros</span>
        </label>
        <label class="price-chart-sim-toggle pc-chip" id="price-chart-stats-label" title="Faixa de preço típica a partir da volatilidade do último ano (não é previsão)">
          <input type="checkbox" id="price-chart-stats" />
          <span>Faixa estatística</span>
          <span class="pc-chip-extra">em <input type="number" id="price-chart-stats-days" class="stats-days" min="1" max="365" value="30" /> dias</span>
        </label>
        <label class="price-chart-sim-toggle pc-chip" id="price-chart-dca-label" title="Seu preço médio de compra vs. comprar o mesmo total em parcelas mensais iguais desde a sua primeira compra">
          <input type="checkbox" id="price-chart-dca" />
          <span>Comparar com compra mensal fixa</span>
        </label>
        <label class="price-chart-sim-toggle pc-chip" id="price-chart-sim-label">
          <input type="checkbox" id="price-chart-sim" />
          <span class="mini-spinner sim-spinner"></span>
          <span id="price-chart-sim-text">Simular compra até o preço médio</span>
        </label>
      </div>
    </div>

    <div class="pc-section">
      <span class="pc-label">Indicadores</span>
      <div class="price-chart-mas" id="price-chart-mas"></div>
    </div>
  </div>
  <div class="price-chart-body">
    <p id="price-chart-error" class="positions-status error" hidden></p>
    <div class="price-chart-legend" id="price-chart-legend"></div>
    <div class="price-chart-canvas" id="price-chart-canvas-wrap">
      <div id="priceChartContainer" class="price-chart-lwc"></div>
      <div class="price-chart-overlay">
        <span class="chart-spinner"></span>
      </div>
      <div class="price-chart-older">
        <span class="mini-spinner"></span>Carregando histórico...
      </div>
    </div>
    <!-- quadros informativos (faixa estatística, compra mensal fixa, mapa de liquidação): abaixo do gráfico;
         data-title = título do quadro (mostrado pelo CSS, o JS só troca o conteúdo) -->
    <div class="price-chart-info-boxes">
      <div class="price-chart-stats" id="price-chart-stats-box" data-title="Faixa estatística" hidden></div>
      <div class="price-chart-stats" id="price-chart-dca-box" data-title="Comparação com compra mensal fixa" hidden></div>
      <div class="price-chart-stats" id="price-chart-liq-box" data-title="Mapa de liquidação" hidden></div>
    </div>
  </div>
  <div class="price-chart-orders" id="price-chart-orders">
    <div class="pco-tabs" role="tablist">
      <button type="button" class="pco-tab active" data-pco-tab="open" role="tab">Ordens abertas <span class="muted" id="pco-open-count"></span></button>
      <button type="button" class="pco-tab" data-pco-tab="history" role="tab">Histórico de ordens</button>
      <button type="button" class="pco-tab" data-pco-tab="trades" role="tab">Histórico de trades</button>
    </div>
    <div class="pco-pane" data-pco-pane="open" id="pco-open"></div>
    <div class="pco-pane" data-pco-pane="history" hidden>
      <div class="pco-filters">
        <div class="pco-presets">
          <button type="button" class="ghost" data-period="1d">1 dia</button>
          <button type="button" class="ghost" data-period="7d">1 semana</button>
          <button type="button" class="ghost" data-period="30d">1 mês</button>
          <button type="button" class="ghost" data-period="90d">3 meses</button>
          <button type="button" class="ghost" data-period="all">Tudo</button>
        </div>
        <label class="pco-dates">
          <span class="muted">Período</span>
          <input type="date" id="pco-from" />
          <span class="muted">→</span>
          <input type="date" id="pco-to" />
        </label>
        <button type="button" class="ghost" id="pco-search">Buscar</button>
        <button type="button" class="ghost" id="pco-reset">Limpar</button>
      </div>
      <div id="pco-history"></div>
    </div>
    <div class="pco-pane" data-pco-pane="trades" hidden>
      <div class="pco-filters">
        <div class="pco-presets">
          <button type="button" class="ghost" data-period="1d">1 dia</button>
          <button type="button" class="ghost" data-period="7d">1 semana</button>
          <button type="button" class="ghost" data-period="30d">1 mês</button>
          <button type="button" class="ghost" data-period="90d">3 meses</button>
          <button type="button" class="ghost" data-period="all">Tudo</button>
        </div>
        <label class="pco-dates">
          <span class="muted">Período</span>
          <input type="date" id="pct-from" />
          <span class="muted">→</span>
          <input type="date" id="pct-to" />
        </label>
        <button type="button" class="ghost" id="pct-search">Buscar</button>
        <button type="button" class="ghost" id="pct-reset">Limpar</button>
      </div>
      <div id="pco-trades"></div>
    </div>
  </div>
  </div>
</section>
