<section class="card tab-panel" data-tab="price-chart" id="price-chart-panel">
  <div class="panel">
  <div class="price-chart-header">
    <div class="asset-picker-wrap">
      <h2>
        <button type="button" class="asset-picker-btn" id="price-chart-title-btn" aria-haspopup="listbox" aria-expanded="false" title="Trocar moeda">
          <span id="price-chart-title">Preço</span>
          <span class="asset-picker-caret" aria-hidden="true">▾</span>
        </button>
      </h2>
      <div class="asset-picker" id="asset-picker" hidden>
        <input type="search" id="asset-picker-search" placeholder="Buscar moeda..." autocomplete="off" spellcheck="false" />
        <ul id="asset-picker-list" role="listbox"></ul>
      </div>
    </div>
    <p id="price-chart-info" class="price-chart-info"></p>
    <div class="price-chart-ranges" id="price-chart-ranges">
      <div class="price-chart-mode price-chart-interval" id="price-chart-interval" title="Tamanho da vela">
        <button class="ghost" data-interval="1h" title="1 hora">1h</button>
        <button class="ghost" data-interval="4h" title="4 horas">4h</button>
        <button class="ghost" data-interval="1d" title="Diário">D</button>
        <button class="ghost" data-interval="1w" title="Semanal">S</button>
        <button class="ghost" data-interval="1M" title="Mensal">M</button>
      </div>
      <span class="price-chart-sep" aria-hidden="true"></span>
      <button class="ghost" data-range="7d">7d</button>
      <button class="ghost" data-range="30d">30d</button>
      <button class="ghost" data-range="90d">90d</button>
      <button class="ghost" data-range="6m">6 meses</button>
      <button class="ghost active" data-range="1y">1 ano</button>
      <button class="ghost" data-range="2y">2 anos</button>
      <button class="ghost" data-range="all">Tudo</button>
      <form class="price-chart-custom" id="price-chart-custom">
        <input type="number" id="price-chart-custom-value" min="1" max="9999" step="1" placeholder="Ex: 2" />
        <select id="price-chart-custom-unit">
          <option value="d">Dias</option>
          <option value="m" selected>Meses</option>
          <option value="y">Anos</option>
        </select>
        <button type="submit" class="ghost">Aplicar</button>
      </form>
    </div>
    <div class="price-chart-toggles">
      <div class="price-chart-mode" id="price-chart-mode">
        <button class="ghost" data-mode="line" title="Linha">Linha</button>
        <button class="ghost" data-mode="candle" title="Velas">Velas</button>
      </div>
      <label class="price-chart-sim-toggle" id="price-chart-projected-label">
        <input type="checkbox" id="price-chart-projected" />
        <span class="mini-spinner sim-spinner"></span>
        <span id="price-chart-projected-text">Preço médio após compras abertas</span>
      </label>
      <label class="price-chart-sim-toggle" id="price-chart-stats-label" title="Faixa de preço típica a partir da volatilidade do último ano (não é previsão)">
        <input type="checkbox" id="price-chart-stats" />
        <span>Faixa estatística em</span>
        <input type="number" id="price-chart-stats-days" class="stats-days" min="1" max="365" value="30" />
        <span>dias</span>
      </label>
      <label class="price-chart-sim-toggle" id="price-chart-dca-label" title="Seu preço médio de compra vs. comprar o mesmo total em parcelas mensais iguais desde a sua primeira compra">
        <input type="checkbox" id="price-chart-dca" />
        <span>Comparar com compra mensal fixa</span>
      </label>
      <label class="price-chart-sim-toggle" id="price-chart-liq-label" title="Regiões onde posições alavancadas dos futuros seriam liquidadas, estimadas a partir do open interest e da razão long/short dos últimos 30 dias (não é dado real)">
        <input type="checkbox" id="price-chart-liq" />
        <span>Mapa de liquidação (estimado)</span>
      </label>
      <label class="price-chart-sim-toggle" id="price-chart-fut-label" title="Painéis de open interest, long/short e taxa de funding dos futuros perpétuos, abaixo do gráfico">
        <input type="checkbox" id="price-chart-fut" />
        <span class="mini-spinner sim-spinner"></span>
        <span id="price-chart-fut-text">Dados de futuros (OI, long/short, funding)</span>
      </label>
      <label class="price-chart-sim-toggle" id="price-chart-sim-label">
        <input type="checkbox" id="price-chart-sim" />
        <span class="mini-spinner sim-spinner"></span>
        <span id="price-chart-sim-text">Simular compra até o preço médio do mouse</span>
      </label>
    </div>
    <div class="price-chart-mas" id="price-chart-mas"></div>
  </div>
  <div class="price-chart-body">
    <p id="price-chart-error" class="positions-status error" hidden></p>
    <div class="price-chart-legend" id="price-chart-legend"></div>
    <div class="price-chart-canvas" id="price-chart-canvas-wrap">
      <div id="priceChartContainer" class="price-chart-lwc"></div>
      <div class="price-chart-overlay">
        <span class="chart-spinner"></span>
      </div>
      <div class="price-chart-older">
        <span class="mini-spinner"></span>Carregando histórico...
      </div>
    </div>
    <!-- quadros informativos (faixa estatística, compra mensal fixa, mapa de liquidação): abaixo do gráfico -->
    <div class="price-chart-info-boxes">
      <div class="price-chart-stats" id="price-chart-stats-box" hidden></div>
      <div class="price-chart-stats" id="price-chart-dca-box" hidden></div>
      <div class="price-chart-stats" id="price-chart-liq-box" hidden></div>
    </div>
  </div>
  <div class="price-chart-orders" id="price-chart-orders">
    <div class="pco-tabs" role="tablist">
      <button type="button" class="pco-tab active" data-pco-tab="open" role="tab">Ordens abertas <span class="muted" id="pco-open-count"></span></button>
      <button type="button" class="pco-tab" data-pco-tab="history" role="tab">Histórico de ordens</button>
    </div>
    <div class="pco-pane" data-pco-pane="open" id="pco-open"></div>
    <div class="pco-pane" data-pco-pane="history" hidden>
      <div class="pco-filters">
        <div class="pco-presets">
          <button type="button" class="ghost" data-period="1d">1 dia</button>
          <button type="button" class="ghost" data-period="7d">1 semana</button>
          <button type="button" class="ghost" data-period="30d">1 mês</button>
          <button type="button" class="ghost" data-period="90d">3 meses</button>
          <button type="button" class="ghost" data-period="all">Tudo</button>
        </div>
        <label class="pco-dates">
          <span class="muted">Período</span>
          <input type="date" id="pco-from" />
          <span class="muted">→</span>
          <input type="date" id="pco-to" />
        </label>
        <button type="button" class="ghost" id="pco-search">Buscar</button>
        <button type="button" class="ghost" id="pco-reset">Limpar</button>
      </div>
      <div id="pco-history"></div>
    </div>
  </div>
  </div>
</section>
